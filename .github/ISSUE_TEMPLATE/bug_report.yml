name: Bug report
description: A crash, wrong output format, broken command or integration problem (not a detection-quality issue).
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or workflow step you ran and the full error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx @promptsonar/cli scan ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PromptSonar version
      description: Output of `promptsonar --version`, or the Action ref you use.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, editor or CI runner.
