name: Feature request
description: Suggest a new rule, integration or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the risk or workflow, ideally with a real example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like PromptSonar to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
