name: CI

# Builds every package and runs the full test suite, lint, feature smoke tests,
# the MCP benchmark and release hygiene on every pull request and push to main.
# Rule changes must not merge unless all of these pass.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # GitHub runs the Action from the committed action/dist without building
      # it, so a source change that is not rebuilt would ship stale code.
      - name: Committed Action bundle matches source
        run: |
          if ! git diff --quiet -- action/dist; then
            git diff --stat -- action/dist
            echo "::error::action/dist is out of date. Run 'npm run build --workspace action' and commit the result."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Feature smoke tests
        run: npm run smoke:features

      - name: MCP benchmark
        run: npm run benchmark:mcp

      - name: Release hygiene
        run: npm run release:hygiene
