name: 'PromptSonar — Prompt Security Scan'
description: 'Scans LLM prompts for OWASP LLM01-LLM07 vulnerabilities.'
author: 'PromptSonar'

inputs:
  fail-on:
    description: 'Severity threshold: critical|high|medium|none'
    default: 'critical'
  waiver-file:
    description: 'Path to .promptsonar-waivers.yaml'
    default: '.promptsonar-waivers.yaml'
  upload-sarif:
    description: 'Upload SARIF to GitHub Security tab'
    default: 'true'
  diff-only:
    description: 'Scan changed files only'
    default: 'true'
  api-key:
    required: false
    description: 'PromptSonar API key (optional)'

outputs:
  score:
    description: 'Overall score 0–100'
  criticals:
    description: 'Critical count'
  highs:
    description: 'High count'
  sarif-path:
    description: 'Path to SARIF output'
  files_scanned:
    description: 'Number of files scanned'
  critical_count:
    description: 'Critical count (alias)'
  high_count:
    description: 'High count (alias)'
  medium_count:
    description: 'Medium count'
  execution_paths:
    description: 'JSON array of execution-path sinks'
  mcp_risk_score:
    description: 'Max MCP risk score across scanned configs'
  confidence_score:
    description: 'Best confidence score (0–100) across inferred workflows'
  confidence_level:
    description: 'Best confidence level (LOW|MEDIUM|HIGH)'
  workflow_diff:
    description: 'JSON workflow diff summary per file'

runs:
  using: 'node20'
  main: 'dist/action.js'
